[project]
name = "reguaz"
version = "0.1.0"
description = "RAG system for Azerbaijani banking and financial regulations"
authors = [
    { name = "Kamal Musayev" },
    { name = "Shamil Aliyev" }
]
requires-python = ">=3.12,<3.15"

dependencies = [
    # ==========================
    # Existing ML / RAG
    # ==========================
    "pdfplumber>=0.11.10,<0.12.0",
    "sentence-transformers>=5.6.0,<6.0.0",
    "flagembedding>=1.4.0,<2.0.0",
    "huggingface-hub>=1.0.0,<2.0.0",
    "chromadb>=1.5.9,<2.0.0",
    "torch>=2.12.1,<3.0.0",
    "einops>=0.8.2,<0.9.0",
    "pandas>=2.2.3,<3.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "rank-bm25>=0.2.2,<0.3.0",
    "qdrant-client>=1.18.0,<2.0.0",
    "llama-cpp-python>=0.3.33,<0.4.0",
    "ragas>=0.4.3,<0.5.0",
    "langchain-nvidia-ai-endpoints>=1.4.3,<2.0.0",
    "openai>=2.45.0,<3.0.0",
    "httpx>=0.28.1,<1.0.0",

    # ==========================
    # Backend API
    # ==========================
    "fastapi>=0.116.0,<1.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",

    # ==========================
    # Utilities
    # ==========================
    "python-dotenv>=1.1.0,<2.0.0",
    "ipython (>=9.15.0,<10.0.0)",
]

[dependency-groups]

dev = [
    "pytest>=8.4.1,<9.0.0",
    "pytest-asyncio>=1.1.0,<2.0.0",
    "ruff>=0.12.4,<1.0.0",
    "black>=25.1.0,<26.0.0",
    "isort>=6.0.1,<7.0.0",
]

frontend = [
    # Build
    "nodeenv>=1.9.1,<2.0.0",

    # React
    "reactpy>=1.1.0,<2.0.0",

    # Optional frontend tooling
    "watchfiles>=1.1.0,<2.0.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
